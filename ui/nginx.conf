server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: every non-file path falls back to index.html
    location / {
        try_files $uri /index.html;
    }

    # proxy the registry API (SSE-friendly: no buffering on the events stream)
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
