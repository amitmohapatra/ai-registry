name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Backend tests (deterministic providers — no model downloads)
        run: python -m pytest backend/tests -q
        env:
          REGISTRY_EMBEDDING_PROVIDER: hashing
          REGISTRY_RERANKER: none

  integration:
    # SDK <-> registry contract tests. The SDK lives in its own repo (mcp-sdk);
    # update `repository:` below to your org path once remotes exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: amitmohapatra/mcp-sdk
          path: mcp-sdk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt && pip install ./mcp-sdk
      - name: Contract integration tests
        run: python -m pytest integration -q
        env:
          REGISTRY_EMBEDDING_PROVIDER: hashing
          REGISTRY_RERANKER: none

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npx tsc -b && npm run build
        working-directory: ui

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images (validates Dockerfiles incl. model pre-bake)
        run: docker compose build
