name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Backend tests (deterministic providers — no model downloads)
        run: python -m pytest backend/tests -q
        env:
          REGISTRY_EMBEDDING_PROVIDER: hashing
          REGISTRY_RERANKER: none

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt && pip install ./sdk/python
      - name: SDK e2e tests (against in-process registry)
        run: python -m pytest sdk/python/tests -q
        env:
          REGISTRY_EMBEDDING_PROVIDER: hashing
          REGISTRY_RERANKER: none

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npx tsc -b && npm run build
        working-directory: ui

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images (validates Dockerfiles incl. model pre-bake)
        run: docker compose build
